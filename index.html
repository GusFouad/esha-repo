<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">

    <!-- Left decorative panel -->
    <div class="panel">
      <div class="panel-content">
        <div class="logo">
          <span class="logo-icon">⬡</span>
          <span class="logo-text">Forge</span>
        </div>
        <h1 class="tagline">Build something<br /><span class="accent">extraordinary.</span></h1>
        <p class="sub">Sign in to access your workspace and start creating.</p>
        <div class="dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
      <div class="panel-bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>
    </div>

    <!-- Right login card -->
    <div class="card-wrap">
      <div class="card">
        <h2 class="card-title">Welcome back</h2>
        <p class="card-sub">Enter your credentials to continue</p>

        <form id="loginForm" novalidate>

          <div class="field">
            <label for="email">Email address</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
            </div>
            <span class="error-msg" id="emailError"></span>
          </div>

          <div class="field">
            <label for="password">
              Password
              <a href="#" class="forgot">Forgot password?</a>
            </label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
              <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="error-msg" id="passwordError"></span>
          </div>

          <div class="remember-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember" />
              <span class="checkmark"></span>
              Remember me for 30 days
            </label>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner" id="spinner" hidden>
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3"
                  stroke-dasharray="31.4" stroke-dashoffset="10" />
              </svg>
            </span>
          </button>

        </form>

        <p class="signup-link">Don't have an account? <a href="#">Create one</a></p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
